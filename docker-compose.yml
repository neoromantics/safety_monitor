version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./demo:/app/demo
    environment:
      - VIDEO_SOURCE=/app/demo/positive.mp4
    # device mapping for Linux webcams
    # devices:
    #   - "/dev/video0:/dev/video0"

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
